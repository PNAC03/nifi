apiVersion: nifi.konpyutaika.com/v1
kind: NifiCluster
metadata:
  name: nifikop  
spec:
  clusterImage: scaicinacrall.azurecr.io/ih-nifi-dev:buildid
  nodeUserIdentityTemplate: node-%d-nifikop
  oneNifiNodePerNode: true
  managedAdminUsers:
  - identity: nifi3scdev
    name: nifi3scdev
  - identity: testuser
    name: testuser
  managedReaderUsers:
  - identity: viewuser
    name: viewuser
  ldapConfiguration:
    enabled: true
    url: ldap://nifi-ldap-auth-svc.uat.svc.cluster.local:389
    searchBase: dc=example,dc=in
    searchFilter: (cn={0})
    authenticationStrategy: SIMPLE
    managerDn: cn=admin,dc=example,dc=in
    managerPassword: password
    referralStrategy: FOLLOW
    identityStrategy: USE_USERNAME
  externalServices:
    - name: nifikop
      spec:
        portConfigs:
          - internalListenerName: https
            port: 443
          - internalListenerName: s2s
            port: 10000
        type: ClusterIP
  listenersConfig:
    internalListeners:
      - containerPort: 8443
        name: https
        type: https
      - containerPort: 6007
        name: cluster
        type: cluster
      - containerPort: 10000
        name: s2s
        type: s2s
    sslSecrets:
      create: true
      tlsSecretName: nifikop-tls
  nifiClusterTaskSpec:
    retryDurationMinutes: 10
  nodeConfigGroups:
    default_group:
      fsGroup: 1337
      isNode: true  
      nodeSelector:
        node-type: dev
      externalVolumeConfigs:
        - name: registry-client-creds
          mountPath: "/opt/nifi/nifi-current/registry-client-creds/"
          secret:
            secretName: "nifi-registry-tls-with-eku-secret"
        # - name: configmaps
        #   mountPath: "/your/mount/path"
        #   configMap:
        #     name: "yourConfigMapName"
      resourcesRequirements:
        limits:
          cpu: "2.5"
          memory: 3Gi
        requests:
          cpu: "1"
          memory: 2Gi
      serviceAccountName: nifikop-cluster
      storageConfigs:
        - mountPath: /opt/nifi/nifi-current/logs
          name: logs
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
            storageClassName: "default"
        - mountPath: /opt/nifi/data
          name: data
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
            storageClassName: "default"
        - mountPath: /opt/nifi/flowfile_repository
          name: flowfile-repository
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
            storageClassName: "default"
        - mountPath: /opt/nifi/nifi-current/conf
          name: conf
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
            storageClassName: "default"
        - mountPath: /opt/nifi/content_repository
          name: content-repository-default
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
            storageClassName: "default"
        - mountPath: /opt/nifi/provenance_repository
          name: provenance-repository-default
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
            storageClassName: "default"
        - mountPath: /var/ih_scripts
          name: ih-scripts
          reclaimPolicy: Delete
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: "default"
  nodes:
    - id: 0
      labels:
        nifi_cr: nifikop
        nifi_node_group: default_group
        nifi_restart: test1
      nodeConfigGroup: default_group
  propagateLabels: false
  readOnlyConfig:
    additionalNifiEnvs:
      - name: INITIAL_ADMIN_IDENTITY
        value: nifi3scdev
    bootstrapProperties:
      # nifiJvmMemory: 2g
      overrideConfigs: |
        # Java 8 Tuning see https://community.hortonworks.com/articles/7882/hdfnifi-best-practices-for-setting-up-a-high-perfo.html for references
        java.arg.7=-XX:ReservedCodeCacheSize=256m
        java.arg.8=-XX:+UseCodeCacheFlushing
    maximumTimerDrivenThreadCount: 40
    nifiProperties:
      overrideConfigs: |
        nifi.nar.library.autoload.directory=../extensions
        nifi.sensitive.props.key=nifikopnifikopnifikop
        nifi.variable.registry.properties=/opt/nifi/nifi-current/conf/variable-registry.properties
        nifi.web.proxy.context.path=/integration-hub/
        nifi.security.identity.mapping.pattern.dn=CN=([^,]*)(?:, (?:O|OU)=.*)?
        nifi.security.identity.mapping.value.dn=$1
        nifi.security.identity.mapping.transform.dn=NONE
        nifi.repository.encryption.protocol.version=1
        nifi.repository.encryption.key.id=primary-key
        nifi.repository.encryption.key.provider=KEYSTORE
        nifi.repository.encryption.key.provider.keystore.location=/opt/nifi/nifi-current/conf/repository.p12
        nifi.repository.encryption.key.provider.keystore.password=itsdone
      webProxyHosts:
        - nifi-internal.3sc.com:443
        - nifi-internal.3sc.com
  service:
    headlessEnabled: true
  sidecarConfigs:
    - args:
        - tail
        - -n+1
        - -F
        - /var/log/nifi-app.log
      image: busybox:1.36
      name: app-log
      resources:
        limits:
          cpu: 50m
          memory: 50Mi
        requests:
          cpu: 50m
          memory: 50Mi
      volumeMounts:
        - mountPath: /var/log
          name: logs
    - args:
        - tail
        - -n+1
        - -F
        - /var/log/nifi-bootstrap.log
      image: busybox:1.36
      name: bootstrap-log
      resources:
        limits:
          cpu: 50m
          memory: 50Mi
        requests:
          cpu: 50m
          memory: 50Mi
      volumeMounts:
        - mountPath: /var/log
          name: logs
    - args:
        - tail
        - -n+1
        - -F
        - /var/log/nifi-user.log
      image: busybox:1.36
      name: user-log
      resources:
        limits:
          cpu: 50m
          memory: 50Mi
        requests:
          cpu: 50m
          memory: 50Mi
      volumeMounts:
        - mountPath: /var/log
          name: logs
  clusterManager: kubernetes
