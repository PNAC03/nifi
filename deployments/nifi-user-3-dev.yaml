apiVersion: nifi.konpyutaika.com/v1
kind: NifiUser
metadata:
  name: ihproduct
  namespace: dev
spec:
  # identity field is use to define the user identity on NiFi cluster side,
  #	it use full when the user's name doesn't suite with Kubernetes resource name.
  identity: ihproduct
  # Contains the reference to the NifiCluster with the one the registry client is linked.
  clusterRef:
    name: nifikop
    namespace: dev
  # Whether or not the the operator also include a Java keystore format (JKS) with you secret
  includeJKS: false
  # Whether or not a certificate will be created for this user.
  createCert: false 
  accessPolicies:
    # defines the kind of access policy, could be "global" or "component".
    - type: global
      action: read
      resource: /flow
    - type: component
      action: read
      resource: /data
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"
    - type: component
      action: read
      resource: /flow
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"
    - type: component
      action: read
      resource: /parameter-contexts
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"
    - type: component
      action: read
      resource: /counters
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"
    - type: component
      action: read
      resource: /provenance
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"
    - type: component
      action: read
      resource: /restricted-components
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"
    - type: component
      action: read
      resource: /policies
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"
    - type: component
      action: read
      resource: /proxy
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"
    - type: component
      action: read
      resource: /site-to-site
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"
    - type: component
      action: read
      resource: /
      componentType: "process-groups"
      componentId: "8d8a51e0-019b-1000-ffff-ffffe807ac01"